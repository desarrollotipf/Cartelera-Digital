trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - frontend/**

variables:
  vmImageName: 'ubuntu-latest'
  appServiceName: 'carteleragh-front' # Ajustar al nombre del App Service en Azure

stages:
- stage: Build
  displayName: 'Compilación Frontend'
  jobs:
  - job: Build
    displayName: 'Compilar React + Vite'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Instalar Node.js 20.x'

    - script: |
        npm ci
        npm run build
      displayName: 'Instalar dependencias y compilar'
      workingDirectory: '$(System.DefaultWorkingDirectory)/frontend'
      env:
        VITE_API_URL: $(VITE_API_URL)

    - script: |
        npm audit --audit-level=high || true
      displayName: 'Auditoría de seguridad (DevSecOps)'
      workingDirectory: '$(System.DefaultWorkingDirectory)/frontend'

    - task: ArchiveFiles@2
      displayName: 'Crear Archivo ZIP'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/frontend/dist'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/frontend.zip
      artifact: drop

- stage: Deploy
  displayName: 'Despliegue Frontend'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: 'Desplegar en Azure App Service'
    environment: 'production'
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureRmWebAppDeployment@4
            displayName: 'Desplegar App Service Frontend'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'auditoria-app' # Service Connection en Azure DevOps
              appType: 'webAppLinux'
              WebAppName: '$(appServiceName)'
              packageForLinux: '$(Pipeline.Workspace)/drop/frontend.zip'
