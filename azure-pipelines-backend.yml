trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - backend/**

variables:
  vmImageName: 'ubuntu-latest'
  appServiceName: 'carteleragh-back' # Ajustar al nombre del App Service en Azure

stages:
- stage: Build
  displayName: 'Compilación y Empaquetado Backend'
  jobs:
  - job: Build
    displayName: 'Preparar Backend'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Instalar Node.js 20.x'

    - script: |
        npm ci
      displayName: 'Instalar dependencias'
      workingDirectory: '$(System.DefaultWorkingDirectory)/backend'

    - script: |
        npm audit --audit-level=high || true
      displayName: 'Auditoría de seguridad (DevSecOps)'
      workingDirectory: '$(System.DefaultWorkingDirectory)/backend'

    - task: ArchiveFiles@2
      displayName: 'Crear Archivo ZIP'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/backend'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/backend.zip
      artifact: drop

- stage: Deploy
  displayName: 'Despliegue Backend'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: 'Desplegar en Azure App Service'
    environment: 'production'
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureRmWebAppDeployment@4
            displayName: 'Desplegar App Service Backend'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'cartelera-connection' # Service Connection en Azure DevOps
              appType: 'webAppLinux'
              WebAppName: '$(appServiceName)'
              packageForLinux: '$(Pipeline.Workspace)/drop/backend.zip'
              RuntimeStack: 'NODE|20-lts'
              StartupCommand: 'node src/app.js'
